<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the Desirable Inter-Feeds media gallery. See our premium livestock, feed formulations, civil engineering projects, and contract farming operations in Zimbabwe.">
  <meta name="keywords" content="Desirable Inter-Feeds gallery, Zimbabwe contract farming, livestock feed photos, broiler chickens, premium cattle, agriculture pictures">
  <title>Media Gallery | Desirable Inter-Feeds (Pvt) Ltd</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .gallery-page-header {
      padding: 6rem 0 3rem;
      text-align: center;
      background: var(--color-dark);
      color: #fff;
    }
    .gallery-page-title {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #fff;
    }
    .gallery-page-desc {
      color: var(--color-text-light);
      max-width: 600px;
      margin: 0 auto;
      font-size: 1.1rem;
      padding: 0 1rem;
    }
    .full-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 3rem 1rem;
    }
    .full-gallery-item {
      position: relative;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: var(--color-surface);
      
      cursor: pointer;
      overflow: hidden;
    }
    .full-gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
      z-index: 10;
    }
    .full-gallery-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      border-radius: 12px;
      transition: opacity 0.3s ease, transform 0.5s ease;
    }
    .full-gallery-item:hover .full-gallery-img {
      transform: scale(1.05);
    }
    
    /* Dynamic floating tooltip styles (Desktop) */
    .gallery-tooltip {
      position: fixed;
      background: rgba(18, 48, 74, 0.95);
      color: #fff;
      padding: 1.25rem;
      border-radius: 8px;
      max-width: 300px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 10px);
      transition: opacity 0.2s, visibility 0.2s, transform 0.2s;
      z-index: 9999;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .gallery-tooltip.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }
    .gallery-tooltip-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    /* Mobile Caption (Shows inside image on touch devices) */
    .mobile-caption {
      display: none;
      position: static;
       
       
       
      background: var(--color-surface);
      color: var(--color-text-muted);
      padding: 1rem;
      font-size: 0.9rem;
      text-align: left;
    }
    .mobile-caption strong {
      display: block;
      color: var(--color-dark);
      margin-bottom: 0.25rem;
      font-size: 1rem;
    }

    @media (hover: none) and (pointer: coarse), (max-width: 768px) {
      .gallery-tooltip {
        display: none !important;
      }
      .mobile-caption {
        display: block;
      }
      .full-gallery-item:hover {
        transform: none;
      }
    }

    .back-nav {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-primary-light);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-nav:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  
  <header class="gallery-page-header">
    <div class="container">
      <h1 class="gallery-page-title">Operations Gallery</h1>
      <p class="gallery-page-desc">A visual journey through our contract farming, premium livestock breeding, nutritional formulations, and infrastructure developments.</p>
      <a href="index.html" class="back-nav"><i data-lucide="arrow-left"></i> Back to Main Site</a>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="full-gallery-grid" id="galleryGrid">
        <!-- JS will populate this -->
      </div>
    </div>
  </section>

  <!-- The Tooltip (Desktop) -->
  <div class="gallery-tooltip" id="galleryTooltip">
    <div class="gallery-tooltip-title" id="tooltipTitle"></div>
    <div id="tooltipDesc"></div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Desirable Inter-Feeds (Pvt) Ltd. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    const galleryData = [
      { src: "Media/chicken coops.jpeg", title: "State-of-the-art Chicken Coops", desc: "Our modern coops are designed with proper ventilation and space to ensure the maximum comfort and health of our poultry flocks." },
      { src: "Media/chicken farms.jpeg", title: "Expansive Chicken Farms", desc: "Operating large-scale poultry farming with strict biosecurity measures and automated feeding systems for optimal growth." },
      { src: "Media/chickens.jpeg", title: "Premium Chickens", desc: "Healthy, disease-free broiler and layer chickens raised on our highly nutritious, custom-milled feeds." },
      { src: "Media/clients being delivered premium dustless feed.jpeg", title: "Direct Feed Delivery", desc: "Ensuring our clients receive freshly milled, premium dustless feeds right at their farm gates without delays." },
      { src: "Media/cows.jpeg", title: "Premium Cattle Care", desc: "Our beef and dairy cattle are pasture-raised and supplemented with our high-protein dairy meal and fattening pellets." },
      { src: "Media/day old chicks.jpeg", title: "Healthy Day-Old Chicks", desc: "Supplying vaccinated and highly resilient day-old chicks to jumpstart robust poultry operations for our contract farmers." },
      { src: "Media/delivering lambs.jpeg", title: "Safe Lamb Deliveries", desc: "Expert veterinary oversight ensuring safe lambing and high survival rates among our premium sheep breeds." },
      { src: "Media/discussions.jpeg", title: "Strategic Discussions", desc: "Our agronomy and advisory teams regularly meet to discuss farm performance and continuous operational improvements." },
      { src: "Media/feeds.jpeg", title: "Nutritional Formulations", desc: "Scientific stock feed formulations engineered for high Feed Conversion Ratios across all livestock categories." },
      { src: "Media/formula making.jpeg", title: "Precision Formula Making", desc: "Every batch of feed is meticulously balanced and tested in-house to guarantee consistent nutritional profiles." },
      { src: "Media/goats.jpeg", title: "Premium Goats", desc: "Raising resilient goat breeds supported by mineral-rich supplements to ensure excellent health and meat quality." },
      { src: "Media/guidance.jpeg", title: "Expert Guidance", desc: "We provide hands-on agronomic support and advisory services to help our partners maximize their agricultural yields." },
      { src: "Media/insights sharing.jpeg", title: "Knowledge Sharing", desc: "Fostering a community of learning where industry insights and modern farming techniques are shared openly." },
      { src: "Media/lab based operations.jpeg", title: "Advanced Lab Operations", desc: "Strict quality control protocols in our modern laboratories ensure all feeds and inputs meet HACCP and ISO standards." },
      { src: "Media/logistics operations.jpeg", title: "Heavy Logistics", desc: "Our robust transport and haulage fleet guarantees efficient nationwide distribution of agricultural inputs and machinery." },
      { src: "Media/meat products output generation.jpeg", title: "Meat Processing", desc: "Generating high-quality meat outputs through ethical processing and stringent food safety protocols." },
      { src: "Media/meeting clients.jpeg", title: "Client Engagements", desc: "Building strong, long-term relationships through transparent face-to-face consultations and contract reviews." },
      { src: "Media/on spot weight of chickens.jpeg", title: "On-Spot Weighing", desc: "Regular field weigh-ins to track Feed Conversion Ratios and ensure optimal growth trajectories." },
      { src: "Media/premium breed goats.jpeg", title: "Specialized Breeds", desc: "Investing in superior genetics for our small ruminants to deliver exceptional meat yields and adaptability." },
      { src: "Media/premium cow care.jpeg", title: "Dairy & Beef Care", desc: "Comprehensive veterinary care and nutritional plans keep our cattle in peak physical condition year-round." },
      { src: "Media/premium farm management.jpeg", title: "Farm Management", desc: "Deploying industry best practices and smart technologies for end-to-end management of agricultural operations." },
      { src: "Media/premium hay.jpeg", title: "Quality Forage", desc: "Harvesting and storing premium hay to provide excellent roughage for our ruminant feeding programs." },
      { src: "Media/proper lab infra.jpeg", title: "World-Class Labs", desc: "Equipped with state-of-the-art testing technology to analyze feed toxicity, sensory metrics, and microbial safety." },
      { src: "Media/seminar.jpeg", title: "Training Seminars", desc: "Empowering farmers through educational seminars on modern husbandry, feed management, and financial planning." },
      { src: "Media/solar.jpeg", title: "Solar Power Solutions", desc: "Installing heavy-duty off-grid solar systems to power irrigation, milling plants, and rural farm infrastructure." },
      { src: "Media/solar 2.jpeg", title: "Sustainable Energy", desc: "Reducing operational costs and our carbon footprint with reliable, high-capacity solar PV installations." },
      { src: "Media/vet surgery.jpeg", title: "Veterinary Surgery", desc: "Professional on-site veterinary interventions and surgical procedures to maintain the highest standards of animal welfare." },
      { src: "Media/young animals raising.jpeg", title: "Raising Young Stock", desc: "Specialized care, creep feeds, and controlled environments for the healthy development of young livestock." },
      { src: "Media/aqua.jpeg", title: "Water Infrastructure", desc: "Building sustainable water sources and boreholes for reliable farm operations." },
      { src: "Media/community learning.jpeg", title: "Community Learning", desc: "Engaging our farming communities through shared learning and knowledge transfer programs." },
      { src: "Media/metal work.png", title: "Metal Fabrication", desc: "High-quality metalwork for civil engineering, farm gates, and structural infrastructure." },
      { src: "Media/team_building.jpg", title: "Team Collaboration", desc: "Our dedicated team working together on-site to ensure the highest standards in our operations and infrastructure." },
      { src: "Media/seminar_interaction.png", title: "Interactive Training", desc: "Engaging training seminars empowering our partners and community with modern agricultural practices and knowledge." },
      { src: "Media/partnership_agreement.jpg", title: "Strategic Partnerships", desc: "Forging strong partnerships and finalizing agreements to expand our reach and improve our agricultural services." }
    ];

    const grid = document.getElementById('galleryGrid');
    const tooltip = document.getElementById('galleryTooltip');
    const tooltipTitle = document.getElementById('tooltipTitle');
    const tooltipDesc = document.getElementById('tooltipDesc');

    galleryData.forEach(item => {
      const el = document.createElement('div');
      el.className = 'full-gallery-item';
      
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.title;
      img.className = 'full-gallery-img';
      
      const mobileCap = document.createElement('div');
      mobileCap.className = 'mobile-caption';
      mobileCap.innerHTML = `<strong>${item.title}</strong>${item.desc}`;

      el.appendChild(img);
      el.appendChild(mobileCap);
      grid.appendChild(el);

      // Desktop events
      el.addEventListener('mouseenter', (e) => {
        if (window.innerWidth <= 768 || window.matchMedia("(hover: none)").matches) return;
        tooltipTitle.textContent = item.title;
        tooltipDesc.textContent = item.desc;
        tooltip.classList.add('show');
      });

      el.addEventListener('mousemove', (e) => {
        if (window.innerWidth <= 768 || window.matchMedia("(hover: none)").matches) return;
        
        // Calculate empty space to determine tooltip position
        const tooltipWidth = 300;
        const tooltipHeight = tooltip.offsetHeight || 150;
        
        let x = e.clientX;
        let y = e.clientY - tooltipHeight - 20; // Default: above cursor
        
        // If not enough space above, show below
        if (y < 10) {
          y = e.clientY + 30;
        }
        
        // Keep within horizontal bounds
        const halfWidth = tooltipWidth / 2;
        if (x - halfWidth < 10) x = halfWidth + 10;
        if (x + halfWidth > window.innerWidth - 10) x = window.innerWidth - halfWidth - 10;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.style.transform = 'translate(-50%, 0)';
      });

      el.addEventListener('mouseleave', () => {
        tooltip.classList.remove('show');
      });
    });
  </script>
</body>
</html>
